[profile.default]
src            = "contracts/src"
test           = "contracts/test"
script         = "contracts/script"
out            = "out"
libs           = ["node_modules", "lib"]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
